name: Build TripBrain APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Find and Extract ZIP
        shell: bash
        run: |
          echo "=== Finding ZIP ==="
          ZIP_FILE=$(find . -maxdepth 2 -type f -iname "*.zip" -print -quit)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file found in repository!"
            exit 1
          fi

          echo "Extracting $ZIP_FILE..."
          rm -rf project
          mkdir project
          unzip -o "$ZIP_FILE" -d project

      - name: Setup Gradle 9.3.1
        shell: bash
        run: |
          echo "=== Installing Gradle 9.3.1 ==="
          wget -q https://services.gradle.org/distributions/gradle-9.3.1-bin.zip
          unzip -q gradle-9.3.1-bin.zip -d "$HOME"
          echo "$HOME/gradle-9.3.1/bin" >> "$GITHUB_PATH"

      - name: Build APK
        shell: bash
        run: |
          echo "=== Locating Project and Building ==="
          SETTINGS=$(find project -type f \( -name "settings.gradle" -o -name "settings.gradle.kts" \) -print -quit)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: Could not locate settings.gradle inside the extracted files!"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")
          cd "$PROJECT_DIR"
          
          # Run build using the updated Gradle 9.3.1
          gradle assembleDebug --no-daemon --stacktrace

      - name: Locate and Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TripBrain-Debug-APK
          path: project/**/build/outputs/apk/debug/*.apk
