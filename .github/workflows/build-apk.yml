name: Build TripBrain APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Check repository files
        shell: bash
        run: |
          echo "===== Repository files ====="
          find . -maxdepth 3 -type f -print

      - name: Find ZIP file
        shell: bash
        run: |
          echo "===== Searching for ZIP ====="

          ZIP_FILE=$(find . -maxdepth 3 -type f -iname "*.zip" -print -quit)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file found in repository!"
            exit 1
          fi

          echo "ZIP FOUND:"
          echo "$ZIP_FILE"

          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      - name: Extract TripBrain project
        shell: bash
        run: |
          echo "===== Extracting project ====="

          rm -rf project
          mkdir -p project

          unzip -o "$ZIP_FILE" -d project

          echo "===== Extracted files ====="
          find project -maxdepth 4 -type f -print

      - name: Find Android project
        shell: bash
        run: |
          echo "===== Finding Android project ====="

          PROJECT_SETTINGS=$(find project \
            -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            -print -quit)

          if [ -z "$PROJECT_SETTINGS" ]; then
            echo "ERROR: Android project not found!"
            echo "No settings.gradle or settings.gradle.kts found."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PROJECT_SETTINGS")

          echo "Android project found at:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Install Gradle 8.9
        shell: bash
        run: |
          echo "===== Installing Gradle 8.9 ====="

          wget -q https://services.gradle.org/distributions/gradle-8.9-bin.zip

          unzip -q gradle-8.9-bin.zip -d "$HOME"

          echo "$HOME/gradle-8.9/bin" >> "$GITHUB_PATH"

          gradle --version

      - name: Check Gradle
        shell: bash
        run: |
          echo "===== Checking Gradle ====="

          cd "$PROJECT_DIR"

          gradle --version

      - name: Build TripBrain APK
        shell: bash
        run: |
          echo "===== Building TripBrain APK ====="

          cd "$PROJECT_DIR"

          gradle assembleDebug --no-daemon --stacktrace

      - name: Find APK
        shell: bash
        run: |
          echo "===== Searching for APK ====="

          APK_FILE=$(find "$PROJECT_DIR" \
            -type f \
            -name "*.apk" \
            -print -quit)

          if [ -z "$APK_FILE" ]; then
            echo "ERROR: APK was not created!"
            exit 1
          fi

          echo "APK FOUND:"
          echo "$APK_FILE"

          echo "APK_FILE=$APK_FILE" >> "$GITHUB_ENV"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TripBrain-APK
          path: ${{ env.APK_FILE }}
          if-no-files-found: error

      - name: Build completed
        shell: bash
        run: |
          echo "===================================="
          echo "       TRIPBRAIN BUILD SUCCESS"
          echo "===================================="
          echo "APK: $APK_FILE"
