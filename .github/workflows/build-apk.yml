name: Build TripBrain APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Check ZIP
        shell: bash
        run: |
          echo "=== Repository files ==="
          ls -lah

          if [ ! -f "tripbrain 2.zip" ]; then
            echo "ERROR: tripbrain 2.zip was not found!"
            echo "ZIP files available:"
            find . -maxdepth 2 -type f -iname "*.zip" -print
            exit 1
          fi

          echo "FOUND: tripbrain 2.zip"

      - name: Extract TripBrain project
        shell: bash
        run: |
          rm -rf project
          mkdir -p project

          echo "Extracting TripBrain..."
          unzip -o "tripbrain 2.zip" -d project

          echo "=== Extracted files ==="
          find project -maxdepth 4 -type f -print | head -200

      - name: Find Android project
        shell: bash
        run: |
          echo "Searching for Android project..."

          SETTINGS=$(find project -type f \( \
            -name "settings.gradle" -o \
            -name "settings.gradle.kts" \
          \) -print -quit)

          if [ -n "$SETTINGS" ]; then
            PROJECT_DIR=$(dirname "$SETTINGS")
          else
            BUILD_FILE=$(find project -type f \( \
              -name "build.gradle" -o \
              -name "build.gradle.kts" \
            \) -print -quit)

            if [ -z "$BUILD_FILE" ]; then
              echo "ERROR: No Android Gradle project found."
              echo "Gradle files found:"
              find project -type f \( \
                -name "build.gradle" -o \
                -name "build.gradle.kts" \
              \) -print
              exit 1
            fi

            PROJECT_DIR=$(dirname "$BUILD_FILE")
          fi

          echo "Android project found at:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Install Gradle 8.9
        shell: bash
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.9-bin.zip

          unzip -q gradle-8.9-bin.zip -d "$HOME"

          echo "$HOME/gradle-8.9/bin" >> "$GITHUB_PATH"

      - name: Check Gradle
        shell: bash
        run: |
          gradle --version

      - name: Build TripBrain APK
        shell: bash
        run: |
          cd "$PROJECT_DIR"

          echo "=== Project contents ==="
          ls -lah

          echo "=== Starting APK build ==="

          gradle assembleDebug \
            --no-daemon \
            --stacktrace \
            --warning-mode all

      - name: Find APK
        shell: bash
        run: |
          echo "=== Searching for APK ==="

          find "$PROJECT_DIR" \
            -type f \
            -name "*.apk" \
            -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TripBrain-debug
          path: |
            project/**/build/outputs/apk/**/*.apk
          if-no-files-found: error
